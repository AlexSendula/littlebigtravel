# Traefik terminates TLS in front of this container, so no HTTPS config here.
#
# Note on add_header: nginx does NOT inherit add_header from an outer level into
# a location that declares its own. So every location below repeats the headers
# it needs rather than relying on a server-level block.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Health endpoint. Answers without touching the filesystem, so it stays cheap
    # and does not depend on the app bundle being present.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed filenames (index-C7Ca73Go.js), so these are safe
    # to cache forever — a new build produces a new name. Missing assets must 404
    # rather than fall back to index.html, or a stale client silently receives
    # HTML where it expected JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff"                             always;
    }

    # The app shell. Must never be cached, or clients keep booting an old bundle
    # that references asset filenames which no longer exist.
    #
    # try_files also gives SPA fallback: a refresh on any path serves the shell
    # instead of 404ing. There is no router today, but there will be.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control          "no-cache, must-revalidate"       always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;
}
